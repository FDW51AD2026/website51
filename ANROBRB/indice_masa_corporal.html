<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de IMC</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .container { background: white; padding: 20px; border-radius: 8px; width: 320px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: inline-block; width: 80px; font-weight: bold; }
        input { width: 180px; padding: 5px; }
        button { padding: 8px 15px; background: #007BFF; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

<div class="container">
    <h2>Calculadora de IMC</h2>
    <div class="form-group">
        <label for="peso">Peso:</label>
        <input type="number" id="peso" step="any" placeholder="Ej. 70">
    </div>
    <div class="form-group">
        <label for="altura">Altura:</label>
        <input type="number" id="altura" step="any" placeholder="Ej. 1.75">
    </div>
    <div class="form-group">
        <label for="imc">IMC:</label>
        <input type="text" id="imc" readonly>
    </div>
    <div class="form-group">
        <label for="resultado">Resultado:</label>
        <input type="text" id="resultado" readonly>
    </div>
    <button onclick="calcularIMC()">Calcular</button>
</div>

<script>
    function calcularIMC() {
        let peso = parseFloat(document.getElementById('peso').value);
        let altura = parseFloat(document.getElementById('altura').value);

        if (!peso || !altura || altura <= 0) {
            alert("Por favor ingresa valores validos para peso y altura.");
            return;
        }

        let imc = peso / (altura * altura);
        document.getElementById('imc').value = imc.toFixed(2);

        let mensaje = "";
        if (imc < 18.5) {
            mensaje = "Bajo peso";
        } else if (imc >= 18.5 && imc <= 25) {
            mensaje = "Peso normal";
        } else {
            mensaje = "Sin clasificacion";
        }

        document.getElementById('resultado').value = mensaje;
    }
</script>

</body>
</html>
