<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Práctica 2 - Figuras</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .caja { border: 1px solid #ccc; border-radius: 6px; padding: 15px; width: 300px; background: #f9f9f9; }
    .campo { margin-bottom: 12px; }
    pre { font-size: 16px; margin: 10px 0 0 20px; }
  </style>
</head>
<body>
  <h2>Práctica 2</h2>
  <div class="caja">
    <div class="campo">
      <label for="figura">Figura:</label>
      <select id="figura" onchange="cambiarFigura()">
        <option value="triangulo">Triangulo</option>
        <option value="rectangulo">Rectangulo</option>
      </select>
    </div>

    <div class="campo">
      <label for="caracter">Caracter:</label>
      <input type="text" id="caracter" maxlength="1" value="*">
    </div>

    <div class="campo" id="divBase" style="display:none;">
      <label for="base">Base:</label>
      <input type="number" id="base" min="1" value="5">
    </div>

    <div class="campo">
      <label for="altura">Altura:</label>
      <input type="number" id="altura" min="1" value="3">
    </div>

    <button type="button" onclick="mostrar()">Mostrar</button>
    <pre id="resultado"></pre>
  </div>

  <script src="p2.js"></script>
</body>
</html>
