<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dibujar triangulos o rectangulos</title>
    </style>
</head>
<body>
    <div class="Contenedor">
        <h1>Dibujar figuras</h1>

        <form id="FormFiguras">

            <label for="Figura">Figura:</label>
            <select id="Figura">
                <option value="Triangulo">Triángulo</option>
                <option value="Rectangulo">Rectángulo</option>
            </select>

            <br><br>

            <label for="Caracter">Carácter:</label>
            <input type="text" id="Caracter" value="*" maxlength="1" required>

            <br><br>

            <div id="GrupoBase" hidden>
                <label for="Base">Base:</label>
                <input type="number" id="Base" min="1">

                <br><br>
            </div>

            <label for="Altura">Altura:</label>
            <input type="number" id="Altura" min="1" required>

            <br><br>

            <button type="submit">Dibujar</button>

        </form>

        <h2>Resultado</h2>
        <pre id="Dibujo"></pre>

    </div>
    
<script src="js/E2P2.js"></script>
</body>
</html>
