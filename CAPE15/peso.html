<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Calculadora de IMC</h1>

  <label for="peso">Peso (kg):</label>
  <input type="number" id="peso" placeholder="Ej. 70"><br>

  <label for="altura">Altura (m):</label>
  <input type="number" id="altura" step="0.01" placeholder="Ej. 1.75"><br>

  <label for="imc">IMC:</label>
  <input type="text" id="imc" readonly><br>

  <label for="resultado">Resultado:</label>
  <input type="text" id="resultado" readonly><br>

  <button id="calcular">Calcular</button>

  <script src="peso.js"></script>
</body>
</html>
