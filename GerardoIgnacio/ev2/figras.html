<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dibujar Figuras</title>
</head>
<body>
    <div style="border: 1px solid #ccc; padding: 10px; width: 300px;">
        <label>Figura:</label>
        <select id="figura" onchange="cambiarFigura()">
            <option value="triangulo">Triangulo</option>
            <option value="rectangulo">Rectangulo</option>
        </select><br><br>

        <label>Caracter:</label>
        <input type="text" id="caracter" value="*" maxlength="1"><br><br>

        <label>Altura:</label>
        <input type="number" id="altura" value="3" min="1"><br><br>

       
        <div id="divBase" style="display: none;">
            <label>Base:</label>
            <input type="number" id="base" value="3" min="1"><br><br>
        </div>

        <button onclick="dibujar()">Mostrar</button>

       
        <pre id="resultado"></pre>
    </div>

    
    <script src="figuras.js"></script>
</body>
</html>
