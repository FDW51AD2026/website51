<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de IMC</title>
</head>
<body>
    <h3>Cálculo del Índice de Masa Corporal (IMC)</h3>
    <label>Peso (kg):</label>
    <input type="number" id="peso"><br><br>
    <label>Altura (m):</label>
    <input type="number" id="altura" placeholder="Ej. 1.75"><br><br>
    <label>IMC:</label>
    <input type="text" id="imc" readOnly><br><br>
    <label>Resultado:</label>
    <input type="text" id="resultado" readOnly><br><br>
    <button onclick="calcularIMC()">Calcular</button>
    <script src="imc.js"></script>
</body>
</html>
