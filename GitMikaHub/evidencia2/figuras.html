<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica 2 - Dibujar Figuras</title>
    <style>
        .box {
            border: 1px solid #7a7a7a;
            padding: 12px;
            width: 250px;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .row label {
            font-size: 14px;
        }
        .row input, .row select {
            width: 140px;
            padding: 2px;
            box-sizing: border-box;
        }
        button {
            margin-top: 4px;
            margin-bottom: 12px;
            padding: 2px 10px;
        }
        #resultado {
            font-family: monospace;
            white-space: pre;
            margin: 0;
            line-height: 1.2;
        }
    </style>
</head>
<body>

    <div class="box">
        <div class="row">
            <label for="figura">Figura:</label>
            <select id="figura" onchange="cambiarFigura()">
                <option value="Triangulo">Triangulo</option>
                <option value="Rectangulo">Rectangulo</option>
            </select>
        </div>

        <div class="row">
            <label for="caracter">Caracter</label>
            <input type="text" id="caracter" value="*" maxlength="1">
        </div>

        <div class="row" id="rowBase" style="display: none;">
            <label for="base">Base</label>
            <input type="number" id="base" min="1">
        </div>

        <div class="row" id="rowAltura">
            <label for="altura">Altura</label>
            <input type="number" id="altura" min="1">
        </div>

        <button onclick="dibujarFigura()">Mostrar</button>

        <pre id="resultado"></pre>
    </div>

    <script>
        function cambiarFigura() {
            const figura = document.getElementById('figura').value;
            const rowBase = document.getElementById('rowBase');
            
            // Si es rectángulo muestra la caja de la base, si es triángulo la oculta
            if (figura === 'Rectangulo') {
                rowBase.style.display = 'flex';
            } else {
                rowBase.style.display = 'none';
            }
            document.getElementById('resultado').textContent = '';
        }

        function dibujarFigura() {
            const figura = document.getElementById('figura').value;
            const caracter = document.getElementById('caracter').value || '*';
            const altura = parseInt(document.getElementById('altura').value);
            const base = parseInt(document.getElementById('base').value);
            const resultado = document.getElementById('resultado');

            let dibujo = '';

            if (isNaN(altura) || altura <= 0) {
                resultado.textContent = 'Ingresa una altura válida.';
                return;
            }

            if (figura === 'Triangulo') {
                for (let i = 1; i <= altura; i++) {
                    dibujo += caracter.repeat(i) + '\n';
                }
            } else if (figura === 'Rectangulo') {
                if (isNaN(base) || base <= 0) {
                    resultado.textContent = 'Ingresa una base válida.';
                    return;
                }
                for (let i = 0; i < altura; i++) {
                    dibujo += caracter.repeat(base) + '\n';
                }
            }

            resultado.textContent = dibujo;
        }
    </script>

</body>
</html>
