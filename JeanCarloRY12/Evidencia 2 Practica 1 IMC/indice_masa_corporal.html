<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Indice de Masa Corporal</title>
</head>
<body>

    <h2>Practica 1 - IMC</h2>

    <label for="peso">Peso:</label>
    <input type="number" id="peso">
    <br><br>

    <label for="altura">Altura:</label>
    <input type="number" id="altura" step="any">
    <br><br>

    <label for="imc">IMC:</label>
    <input type="text" id="imc" readonly>
    <br><br>

    <label for="resultado">Resultado:</label>
    <input type="text" id="resultado" readonly>
    <br><br>

    <button onclick="calcular()">Calcular</button>

    <script>
        function calcular() {
            let peso = parseFloat(document.getElementById("peso").value);
            let altura = parseFloat(document.getElementById("altura").value);

            if (isNaN(peso) || isNaN(altura) ||
                peso <= 0 || altura <= 0) {
                alert("Ingresa un peso y una altura validos.");
                return;
            }

            let imc = peso / (altura * altura);

            document.getElementById("imc").value = imc.toFixed(2);

            if (imc < 18.5) {
                document.getElementById("resultado").value = "Bajo Peso";
            } else if (imc <= 25) {
                document.getElementById("resultado").value = "Peso Normal";
            } else {
                document.getElementById("resultado").value = "Sin clasificacion";
            }
        }
    </script>

</body>
</html>
