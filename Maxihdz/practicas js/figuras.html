<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dibujar Figuras</title>
</head>
<body>
    <form action="">
        <label for="figura">Figura:</label>
        <select id="figura" name="figura">
            <option value="triangulo">Triangulo</option>
            <option value="rectangulo">Rectangulo</option>
        </select><br><br>

        <label for="caracter">Caracter</label>
        <input type="text" id="caracter" name="caracter" maxlength="1"><br><br>

        <label for="altura">Altura</label>
        <input type="number" id="altura" name="altura"><br><br>

        <label for="base" id="labelBase">Base</label>
        <input type="number" id="base" name="base"><br><br>

        <button type="button" id="btnMostrar">Mostrar</button>
    </form>

    <pre id="resultado"></pre>

    <script src="figuras.js"></script>
</body>
</html>
