<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dibujar figuras</title>
  <script src="figuras.js"></script>
</head>
<body>
  <p>Figura:
    <select id="figura" onchange="cambiarFigura()">
      <option value="triangulo">Triángulo</option>
      <option value="rectangulo">Rectángulo</option>
    </select>
  </p>

  <p>Carácter <input type="text" id="caracter" maxlength="1" value="*"></p>

  <p id="campoBase" style="display: none;">Base <input type="number" id="base" value="5"></p>

  <p>Altura <input type="number" id="altura" value="3"></p>

  <button onclick="mostrar()">Mostrar</button>

  <pre id="resultado"></pre>
</body>
</html>
