<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto - Sabermetría</title>
</head>
<body>
    <header>
        <h1>Contacto y Comunidad</h1>
        <nav>
            <a href="index.html">Inicio</a> |
            <a href="nosotros.html">¿Qué es?</a> |
            <a href="servicios.html">Métricas</a> |
            <a href="productos.html">Herramientas</a> |
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Envíanos tus comentarios</h2>
            <form action="#" method="POST">
                <label for="nombre">Nombre:</label><br>
                <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre"><br><br>

                <label for="email">Correo electrónico:</label><br>
                <input type="email" id="email" name="email" placeholder="correo@ejemplo.com"><br><br>

                <label for="metrica">Métrica favorita:</label><br>
                <select id="metrica" name="metrica">
                    <option value="war">WAR</option>
                    <option value="ops">OPS</option>
                    <option value="fip">FIP</option>
                </select><br><br>

                <label for="comentario">Mensaje:</label><br>
                <textarea id="comentario" name="comentario" rows="4" cols="30"></textarea><br><br>

                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 - Análisis Sabermétrico</p>
    </footer>
</body>
</html>
