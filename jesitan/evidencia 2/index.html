<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo de Sueldo - EV2</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }
        .container {
            border: 2px solid #000;
            padding: 20px;
            width: 300px;
        }
        .form-group {
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .form-group label {
            font-weight: bold;
        }
        .form-group input {
            width: 120px;
            padding: 4px;
        }
        .buttons {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }
        .buttons button {
            padding: 6px 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="form-group">
            <label for="turno">Turno</label>
            <input type="text" id="turno" placeholder="matutino">
        </div>

        <div class="form-group">
            <label for="horas">Horas</label>
            <input type="number" id="horas" value="1" min="0">
        </div>

        <div class="form-group">
            <label for="pagoHora">Pago por Hora</label>
            <input type="number" id="pagoHora" value="5" min="0" step="any">
        </div>

        <div class="form-group">
            <label for="sueldo">Sueldo</label>
            <input type="text" id="sueldo" readonly>
        </div>

        <div class="buttons">
            <button onclick="calcularSueldo()">Calcular</button>
            <button onclick="limpiarFormulario()">Limpiar</button>
        </div>
    </div>

    <!-- Enlace al archivo JavaScript externo requerido -->
    <script src="p1.js"></script>
</body>
</html>
