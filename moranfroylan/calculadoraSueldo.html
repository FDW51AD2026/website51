<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calculadora de sueldo</title>
</head>
<body>
  <h1>Calculadora de sueldo</h1>

  <form id="formulario">
    <label for="turno">Turno:</label>
    <select id="turno">
      <option value="matutino">Matutino</option>
      <option value="vespertino">Vespertino</option>
      <option value="nocturno">Nocturno</option>
    </select>
    <br><br>

    <label for="horas">Horas trabajadas:</label>
    <input type="number" id="horas" min="0.01" step="0.01">
    <br><br>

    <label for="pagoHora">Pago por hora:</label>
    <input type="number" id="pagoHora" min="0.01" step="0.01">
    <br><br>

    <button type="submit">Calcular</button>
    <button type="reset">Limpiar</button>
  </form>

  <p id="error"></p>

  <div id="resultado" hidden>
    <h2>Sueldo total</h2>
    <p id="sueldo"></p>
    <p id="detalle"></p>
  </div>

  <h3>Aumentos por turno</h3>
  <p>Matutino: pago normal</p>
  <p>Vespertino: aumento del 3%</p>
  <p>Nocturno: aumento del 100%</p>

  <script>
    const formulario = document.getElementById("formulario");

    function calcularSueldo(horas, pagoHora, turno) {
      let aumento = 1;

      if (turno === "vespertino") {
        aumento = 1.03;
      } else if (turno === "nocturno") {
        aumento = 2;
      }

      return horas * pagoHora * aumento;
    }

    function formatoDinero(cantidad) {
      return new Intl.NumberFormat("es-MX", {
        style: "currency",
        currency: "MXN"
      }).format(cantidad);
    }

    formulario.addEventListener("submit", function(evento) {
      evento.preventDefault();

      const horas = Number(document.getElementById("horas").value);
      const pagoHora = Number(document.getElementById("pagoHora").value);
      const turno = document.getElementById("turno").value;
      const error = document.getElementById("error");
      const resultado = document.getElementById("resultado");

      if (horas <= 0 || pagoHora <= 0) {
        error.textContent = "Escribe las horas y el pago por hora.";
        resultado.hidden = true;
        return;
      }

      const sueldo = calcularSueldo(horas, pagoHora, turno);
      const pagoBase = horas * pagoHora;
      const aumento = sueldo - pagoBase;

      document.getElementById("sueldo").textContent = formatoDinero(sueldo);
      document.getElementById("detalle").textContent =
        "Pago base: " + formatoDinero(pagoBase) +
        " | Aumento: " + formatoDinero(aumento);

      error.textContent = "";
      resultado.hidden = false;
    });

    formulario.addEventListener("reset", function() {
      document.getElementById("error").textContent = "";
      document.getElementById("resultado").hidden = true;
    });
  </script>
</body>
</html>
