<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de sueldo</title>
  <script src="calculadoraSueldo.js" defer></script>
</head>
<body>
  <h1>Calculadora de sueldo</h1>

  <form id="formulario">
    <label for="turno">Turno:</label>
    <select id="turno">
      <option value="matutino">Matutino</option>
      <option value="vespertino">Vespertino</option>
      <option value="nocturno">Nocturno</option>
    </select>
    <br><br>

    <label for="horas">Horas trabajadas:</label>
    <input type="number" id="horas" min="0.01" step="0.01" required>
    <br><br>

    <label for="pagoHora">Pago por hora:</label>
    <input type="number" id="pagoHora" min="0.01" step="0.01" required>
    <br><br>

    <button type="submit">Calcular</button>
    <button type="reset">Limpiar</button>
  </form>

  <p id="error"></p>

  <div id="resultado" hidden>
    <h2>Sueldo total</h2>
    <p id="sueldo"></p>
    <p id="detalle"></p>
  </div>

  <h3>Aumentos por turno</h3>
  <p>Matutino: pago normal</p>
  <p>Vespertino: aumento del 3%</p>
  <p>Nocturno: aumento del 100%</p>
</body>
</html>
