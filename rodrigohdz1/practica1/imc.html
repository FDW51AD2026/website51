<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cálculo del IMC</title>
  <style>
    .caja {
      display: inline-block;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 12px 16px;
    }
    .caja p { margin: 6px 0; }
  </style>
</head>
<body>
  <div class="caja">
    <p>Peso (kg): <input type="text" id="peso"></p>
    <p>Altura (m): <input type="text" id="altura"></p>
    <p>IMC: <input type="text" id="imc" readonly></p>
    <p>Resultado: <input type="text" id="resultado" readonly></p>
    <p><button type="button">Calcular</button></p>
  </div>
</body>
</html>
