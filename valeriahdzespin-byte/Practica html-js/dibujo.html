<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dibujo</title>
</head>
<body>
    <h1>Dibujar Figura</h1>
    <form action="">
        <label for="figura">Figura:</label>
        <select name="figura" id="figura">
            <option value="1">Triangulo</option>
            <option value="2">Rectangulo</option>
        </select>
    <br>
        <label for="caract">Caracter:</label>
        <input type="text" name="caract" id="caract">
    <br>
        <label for="altura">Altura:</label>
        <input type="text" name="altura" id="altura">
    <br>
    <div id="ocultBase" hidden>  
        <label for="base">Base:</label>
        <input type="text" name="base" id="base">
    </div>    
<br>
        <button id="btnMostrar">Mostrar</button>
<br>
        <figure for="resul">
            <pre name="resul" id="resul"></pre>
        </figure>
    </form>
    <script src="dibujo.js"></script>
</body>
</html>
